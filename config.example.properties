# ============================================================
# Report Exporter - Configuração de exemplo
# ============================================================

# Conexão com o banco de dados SQL.
# Use um usuário com permissão SOMENTE LEITURA.
#
# sendStringParametersAsUnicode=false evita conversões implícitas
# e pode ajudar na utilização dos índices do SQL Server.
db.url=jdbc:sqlserver://HOST:PORT;databaseName=DATABASE_NAME;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false
db.user=READ_ONLY_USER
db.password=YOUR_PASSWORD

# Filial padrão dos relatórios.
# Utilizada pelo token @filial nos parâmetros das consultas.
default.filial=01

# Sufixo das tabelas do Protheus.
# Exemplo:
#   empresa 01 -> SB1010
#   empresa 02 -> SB1020
db.table_suffix=010